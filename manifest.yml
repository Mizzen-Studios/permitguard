modules:
  jira:issuePanel:
  - key: permitguard-panel
    resource: permit-app
    resolver:
      function: probe-resolver
    viewportSize: large
    title: PermitGuard
    icon: resource:capability-probe;icon.svg
  jira:adminPage:
  - key: permitguard-admin
    resource: permit-app
    resolver:
      function: probe-resolver
    title: PermitGuard
  jira:workflowValidator:
  - key: permitguard-start-validator
    name: PermitGuard start work gate
    description: Opt-in decision-support gate. List and disable before uninstall.
      Project Warn-only is the install default.
    function: gate-start
  - key: permitguard-release-validator
    name: PermitGuard release work gate
    description: Opt-in decision-support gate. List and disable before uninstall.
      Project Warn-only is the install default.
    function: gate-release
  action:
  - key: check_readiness
    name: Check readiness
    function: readiness-action
    actionVerb: GET
    description: Read current deterministic readiness and blockers. Decision support
      only; never authorizes work.
    inputs:
      issueKey:
        title: Jira work item key
        type: string
        required: true
        description: Work item containing the PermitGuard permit. Caller access is
          checked.
  - key: request_activation
    name: Request activation
    function: activation-action
    actionVerb: CREATE
    description: Propose a PENDING activation assigned to a named verifier. Cannot
      activate; the person at equipment must confirm on tablet.
    inputs:
      issueKey:
        title: Jira work item key
        type: string
        required: true
        description: Work item containing the PermitGuard permit. Caller access is
          checked.
      verifierId:
        title: Named verifier account ID
        type: string
        required: true
        description: Must already be a named human verifier on this permit.
  rovo:mcp:
  - key: permitguard-mcp
    name: PermitGuard
    tools:
    - check_readiness
    - request_activation
  macro:
  - key: permitguard-lockboard
    title: PermitGuard lock-board snapshot
    resource: permit-app
    resolver:
      function: probe-resolver
    description: PermitGuard lock-board snapshot setup; no live safety claims.
  function:
  - key: probe-resolver
    handler: forge/index.handler
  - key: readiness-action
    handler: forge/index.checkReadiness
  - key: activation-action
    handler: forge/index.requestActivation
  - key: gate-start
    handler: forge/validator.start
  - key: gate-release
    handler: forge/validator.release
  jira:entityProperty:
  - key: permitguard-property
    entityType: issue
    propertyKey: permitguard.snapshot
    values:
    - path: state
      type: string
      searchAlias: permitguardState
    - path: mode
      type: string
      searchAlias: permitguardMode
    - path: updatedAt
      type: date
      searchAlias: permitguardUpdatedAt
  jira:projectSettingsPage:
  - key: permitguard-project-settings
    resource: permit-app
    resolver:
      function: probe-resolver
    title: PermitGuard
  rovo:agent:
  - key: permitguard-judge-v2
    name: PermitGuard Judge
    prompt: 'Provide LOTO permit decision support only. The site procedure remains
      authoritative. Always call check_readiness; report NOT CLEARED and its blockers
      verbatim. request_activation proposes PENDING only, assigned to a named verifier.
      A human at equipment confirms using QR and tablet. Never invent clearance, locks,
      verification, presence or activation. Never read instruments or calibration
      data. Never claim QR proves presence. Do not bypass other crews'' personal locks.
      Always start your response with the check_readiness message field verbatim.
      The message already contains the WORK_START-only/no-release-clearance caveat
      when cleared. State that caveat exactly once: do not repeat it as another sentence
      or Scope field. If a WORK_START message lacks the caveat, add one clear line
      that WORK_START is not release clearance. Never omit or weaken this boundary.
      Explain blockers in plain language; codes may appear in parentheses only alongside
      their explanation. Use the plain crew label Simulated Crew B, without an @mention
      or possessive punctuation. Do not show transitionAllowed unless asked; it is
      an advisory machine field, not work or energization authority.'
    actions:
    - check_readiness
    - request_activation
resources:
- key: capability-probe
  path: static/capability-probe/dist
- key: permit-app
  path: static/permit-app/dist
- key: agent-resource
  path: resource/agent
permissions:
  scopes:
  - read:jira-work
  - read:cmdb-object:jira
  - read:servicedesk-request
  - manage:jira-configuration
  - storage:app
  - write:jira-work
  - read:jira-user
  - read:space:confluence
  - read:space.permission:confluence
  - read:page:confluence
  - write:page:confluence
  - read:cmdb-type:jira
app:
  id: ari:cloud:ecosystem::app/60f4bdda-1062-4e5b-aab6-1d9a9cf53a90
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  storage:
    entities:
    - name: permitguard-site
      attributes:
        revision:
          type: integer
        data:
          type: any
